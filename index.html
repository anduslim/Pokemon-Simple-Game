<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1b2620">
<title>Pokémon Simple Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b2620; color: #d9e4cf; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 16px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .shell { touch-action: none; -webkit-touch-callout: none; background: #cbc6ba; border-radius: 14px 14px 52px 14px; padding: 18px 18px 22px; box-shadow: 0 12px 30px rgba(0,0,0,.5), inset -4px -6px 0 #a7a296; }
  .bezel { background: #4f5263; border-radius: 10px 10px 32px 10px; padding: 18px 22px 20px; }
  canvas { display: block; width: 320px; height: 288px; image-rendering: pixelated; image-rendering: crisp-edges; background: #e0f8d0; }
  .label { margin-top: 10px; text-align: center; font: italic 700 13px/1 system-ui, sans-serif; letter-spacing: 2px; color: #2c3a8c; }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 4px; }
  .dpad { position: relative; width: 102px; height: 102px; }
  .dpad button, .dpad span { position: absolute; width: 34px; height: 34px; background: #2a2a2e; border: 0; padding: 0; }
  .dpad .up { left: 34px; top: 0; border-radius: 4px 4px 0 0; }
  .dpad .down { left: 34px; bottom: 0; border-radius: 0 0 4px 4px; }
  .dpad .left { left: 0; top: 34px; border-radius: 4px 0 0 4px; }
  .dpad .right { right: 0; top: 34px; border-radius: 0 4px 4px 0; }
  .dpad span { left: 34px; top: 34px; }
  .ab { display: flex; gap: 16px; transform: rotate(-25deg); }
  .ab button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #9a2352; color: #f3d6e1; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 #5e1431; }
  .ss { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
  .ss button { width: 50px; height: 12px; border-radius: 6px; border: 0; background: #77767c; transform: rotate(-25deg); position: relative; }
  .ss button::after { content: attr(data-label); position: absolute; top: 16px; left: 0; right: 0; font-size: 9px; font-weight: 700; color: #3b3f73; letter-spacing: 1px; }
  button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
  button:active, button.on { filter: brightness(0.75); }
  .hint { margin-top: 14px; font-size: 13px; opacity: .75; text-align: center; line-height: 1.5; }
  kbd { background: #2d3a32; border-radius: 4px; padding: 1px 5px; font-family: inherit; }
  @media (hover: hover) and (pointer: fine) { .controls, .ss { display: none; } }
  @media (hover: none), (pointer: coarse) { .hint { display: none; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="bezel">
    <canvas id="screen" width="160" height="144"></canvas>
  </div>
  <div class="label">POCKET MONSTER</div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-key="up" aria-label="Up"></button>
      <button class="left" data-key="left" aria-label="Left"></button>
      <span></span>
      <button class="right" data-key="right" aria-label="Right"></button>
      <button class="down" data-key="down" aria-label="Down"></button>
    </div>
    <div class="ab">
      <button data-key="B">B</button>
      <button data-key="A">A</button>
    </div>
  </div>
  <div class="ss">
    <button data-key="SELECT" data-label="SOUND" aria-label="Toggle sound"></button>
    <button data-key="START" data-label="START" aria-label="Start"></button>
  </div>
</div>
<div class="hint" id="hint">
  <kbd>←↑↓→</kbd> move &nbsp; <kbd>Z</kbd>/<kbd>Space</kbd> A (talk, confirm) &nbsp; <kbd>X</kbd> B (back)<br>
  <kbd>Enter</kbd> START (menu) &nbsp; <kbd>M</kbd> sound: all / effects only / off
</div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Palette & drawing helpers (classic 4-shade green Game Boy palette)
// ---------------------------------------------------------------------------
const C = ['#e0f8d0', '#88c070', '#346856', '#081820'];
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rect(g, x, y, w, h, c) { g.fillStyle = C[c]; g.fillRect(x, y, w, h); }
function blit(g, rows, ox = 0, oy = 0) {
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') rect(g, ox + x, oy + y, 1, 1, +r[x]); });
}
function sprite(rows) { const c = mk(rows[0].length, rows.length); blit(c.getContext('2d'), rows); return c; }
const mirror = rows => rows.map(r => [...r].reverse().join(''));
const withRows = (rows, repl) => rows.map((r, i) => repl[i] !== undefined ? repl[i] : r);
function drawSprite(img, x, y, sc = 1, flip = false) {
  const w = img.width * sc, h = img.height * sc;
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, x, y, w, h);
}

// ---------------------------------------------------------------------------
// 5x7 bitmap font
// ---------------------------------------------------------------------------
const FONT = {
  A: '.xxx. x...x x...x xxxxx x...x x...x x...x', B: 'xxxx. x...x x...x xxxx. x...x x...x xxxx.',
  C: '.xxx. x...x x.... x.... x.... x...x .xxx.', D: 'xxxx. x...x x...x x...x x...x x...x xxxx.',
  E: 'xxxxx x.... x.... xxxx. x.... x.... xxxxx', F: 'xxxxx x.... x.... xxxx. x.... x.... x....',
  G: '.xxx. x...x x.... x.xxx x...x x...x .xxxx', H: 'x...x x...x x...x xxxxx x...x x...x x...x',
  I: '.xxx. ..x.. ..x.. ..x.. ..x.. ..x.. .xxx.', J: '..xxx ...x. ...x. ...x. ...x. x..x. .xx..',
  K: 'x...x x..x. x.x.. xx... x.x.. x..x. x...x', L: 'x.... x.... x.... x.... x.... x.... xxxxx',
  M: 'x...x xx.xx x.x.x x.x.x x...x x...x x...x', N: 'x...x x...x xx..x x.x.x x..xx x...x x...x',
  O: '.xxx. x...x x...x x...x x...x x...x .xxx.', P: 'xxxx. x...x x...x xxxx. x.... x.... x....',
  Q: '.xxx. x...x x...x x...x x.x.x x..x. .xx.x', R: 'xxxx. x...x x...x xxxx. x.x.. x..x. x...x',
  S: '.xxxx x.... x.... .xxx. ....x ....x xxxx.', T: 'xxxxx ..x.. ..x.. ..x.. ..x.. ..x.. ..x..',
  U: 'x...x x...x x...x x...x x...x x...x .xxx.', V: 'x...x x...x x...x x...x x...x .x.x. ..x..',
  W: 'x...x x...x x...x x.x.x x.x.x x.x.x .x.x.', X: 'x...x x...x .x.x. ..x.. .x.x. x...x x...x',
  Y: 'x...x x...x .x.x. ..x.. ..x.. ..x.. ..x..', Z: 'xxxxx ....x ...x. ..x.. .x... x.... xxxxx',
  0: '.xxx. x...x x..xx x.x.x xx..x x...x .xxx.', 1: '..x.. .xx.. ..x.. ..x.. ..x.. ..x.. .xxx.',

  '!': '..x.. ..x.. ..x.. ..x.. ..x.. ..... ..x..', '?': '.xxx. x...x ....x ...x. ..x.. ..... ..x..',
  "'": '..x.. ..x.. .x... ..... ..... ..... .....', '-': '..... ..... ..... xxxxx ..... ..... .....',
  ':': '..... .xx.. .xx.. ..... .xx.. .xx.. .....', '/': '....x ...x. ...x. ..x.. .x... .x... x....',
  '(': '...x. ..x.. .x... .x... .x... ..x.. ...x.', ')': '.x... ..x.. ...x. ...x. ...x. ..x.. .x...',
  'é': '...x. ..x.. .xxx. x...x xxxxx x.... .xxx.',
  '▶': 'x.... xx... xxx.. xxxx. xxx.. xx... x....',
  '▼': '..... ..... xxxxx .xxx. ..x.. ..... .....',
};
// Glyphs are stored 5 wide for readability and widened to 7 (in an 8px cell, like the Game Boy font).
const CW = 8, WIDEN = [0, 1, 1, 2, 3, 3, 4];
const GLYPH = {};
function glyph(c, col) {
  const k = c + col;
  if (k in GLYPH) return GLYPH[k];
  const src = FONT[c];
  if (!src) return (GLYPH[k] = null);
  const g = mk(7, 7), gc = g.getContext('2d');
  src.split(' ').map(r => WIDEN.map(i => r[i]).join('')).forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'x') rect(gc, x, y, 1, 1, col); }));
  return (GLYPH[k] = g);
}
const norm = c => (c === 'é' || c === 'É') ? 'é' : c.toUpperCase();
function drawText(s, x, y, col = 3, sc = 1) {
  let cx = x;
  for (const ch of String(s)) {
    if (ch !== ' ') { const g = glyph(norm(ch), col); if (g) ctx.drawImage(g, cx, y, 7 * sc, 7 * sc); }
    cx += CW * sc;
  }
}
const centerText = (s, y, col = 3, sc = 1) => drawText(s, Math.round((160 - (s.length * CW - 1) * sc) / 2), y, col, sc);
function box(x, y, w, h) { rect(ctx, x, y, w, h, 3); rect(ctx, x + 1, y + 1, w - 2, h - 2, 0); rect(ctx, x + 2, y + 2, w - 4, h - 4, 3); rect(ctx, x + 3, y + 3, w - 6, h - 6, 0); }

// ---------------------------------------------------------------------------
// Tiles (16x16)
// ---------------------------------------------------------------------------
function tile(fn) { const c = mk(16, 16); fn(c.getContext('2d')); return c; }
function lawn(g) { rect(g, 0, 0, 16, 16, 0); for (const [x, y] of [[2, 2], [10, 5], [4, 10], [12, 12]]) { rect(g, x, y, 1, 1, 1); rect(g, x + 2, y, 1, 1, 1); rect(g, x + 1, y + 1, 1, 1, 1); } }
function floor(g) { rect(g, 0, 0, 16, 16, 0); rect(g, 0, 0, 16, 1, 1); rect(g, 0, 8, 16, 1, 1); rect(g, 0, 0, 1, 16, 1); rect(g, 8, 0, 1, 16, 1); }
const TALL = ['11111111', '13111311', '32313231', '22222222', '11111111', '11131113', '31323132', '22222222'];
const TREE = [

  '3222111222222223', '.32221112222223.', '.33222222222233.', '..333222222333..',
  '....33333333....', '......3113......', '......3113......', '.....331133.....'];
const T = {

  ',': tile(g => { rect(g, 0, 0, 16, 16, 0); for (let y = 1; y < 16; y += 4) for (let x = (y % 8 === 1 ? 1 : 3); x < 16; x += 4) rect(g, x, y, 1, 1, 1); }),
  'G': tile(g => { for (let y = 0; y < 16; y += 8) for (let x = 0; x < 16; x += 8) blit(g, TALL, x, y); }),
  'T': tile(g => { rect(g, 0, 0, 16, 16, 0); blit(g, TREE); }),
  'f': tile(g => { rect(g, 0, 0, 16, 16, 0); for (const [x, y] of [[2, 2], [10, 3], [5, 10], [12, 11]]) { rect(g, x + 1, y, 1, 1, 2); rect(g, x, y + 1, 1, 1, 2); rect(g, x + 2, y + 1, 1, 1, 2); rect(g, x + 1, y + 2, 1, 1, 2); rect(g, x + 1, y + 1, 1, 1, 3); } }),
  'F': tile(g => { lawn(g); rect(g, 0, 4, 16, 2, 2); rect(g, 0, 4, 16, 1, 3); rect(g, 0, 10, 16, 2, 2); rect(g, 0, 10, 16, 1, 3); rect(g, 3, 2, 3, 12, 3); rect(g, 4, 3, 1, 10, 1); rect(g, 11, 2, 3, 12, 3); rect(g, 12, 3, 1, 10, 1); }),
  'S': tile(g => { lawn(g); rect(g, 7, 10, 2, 6, 3); rect(g, 1, 2, 14, 9, 3); rect(g, 2, 3, 12, 7, 1); rect(g, 4, 5, 8, 1, 2); rect(g, 4, 7, 6, 1, 2); }),
  'r': tile(g => { rect(g, 0, 0, 16, 16, 2); rect(g, 0, 0, 16, 1, 1); for (let b = 0; b < 4; b++) { rect(g, 0, b * 4 + 3, 16, 1, 3); for (let x = (b % 2 ? 0 : 4); x < 16; x += 8) rect(g, x, b * 4, 1, 3, 3); } }),
  'h': tile(g => { rect(g, 0, 0, 16, 16, 0); for (const y of [3, 7, 11]) rect(g, 0, y, 16, 1, 1); rect(g, 0, 15, 16, 1, 2); }),
  'R': tile(g => { rect(g, 0, 0, 16, 16, 1); for (let x = 1; x < 16; x += 4) rect(g, x, 0, 1, 15, 2); rect(g, 0, 15, 16, 1, 3); }),
  'l': tile(g => { rect(g, 0, 0, 16, 16, 0); rect(g, 0, 0, 1, 15, 1); rect(g, 8, 0, 1, 15, 1); rect(g, 0, 15, 16, 1, 2); }),
  '_': tile(floor),
  'X': tile(g => { rect(g, 0, 0, 16, 16, 0); for (let x = 1; x < 16; x += 4) rect(g, x, 0, 2, 12, 1); rect(g, 0, 12, 16, 1, 3); rect(g, 0, 13, 16, 3, 2); }),
  'B': tile(g => { rect(g, 0, 0, 16, 16, 3); for (let s = 0; s < 3; s++) for (let x = 1; x < 15; x += 2) rect(g, x, 1 + s * 5, 1, 4, [0, 1, 2, 1, 0, 2, 1][(x + s) % 7]); }),
  'C': tile(g => { rect(g, 0, 0, 16, 16, 3); rect(g, 1, 1, 14, 14, 1); rect(g, 3, 2, 10, 7, 3); rect(g, 4, 3, 8, 5, 0); rect(g, 5, 4, 5, 1, 2); rect(g, 5, 6, 3, 1, 2); rect(g, 3, 11, 2, 2, 3); rect(g, 7, 11, 2, 2, 3); rect(g, 11, 11, 2, 2, 2); }),
  'K': tile(g => { floor(g); rect(g, 0, 3, 16, 10, 3); rect(g, 0, 4, 16, 8, 1); rect(g, 0, 4, 16, 1, 0); rect(g, 2, 13, 2, 3, 3); rect(g, 12, 13, 2, 3, 3); }),
  'E': tile(g => { floor(g); rect(g, 1, 3, 14, 10, 2); rect(g, 1, 5, 14, 1, 3); rect(g, 1, 9, 14, 1, 3); }),
};
T.n = tile(g => { g.drawImage(T.h, 0, 0); rect(g, 3, 3, 10, 9, 3); rect(g, 4, 4, 8, 7, 1); rect(g, 8, 4, 1, 7, 3); rect(g, 4, 7, 8, 1, 3); rect(g, 5, 5, 2, 1, 0); });
T.d = tile(g => { g.drawImage(T.h, 0, 0); rect(g, 3, 3, 10, 13, 3); rect(g, 4, 4, 8, 12, 2); rect(g, 10, 10, 1, 1, 0); });
T.D = tile(g => { g.drawImage(T.l, 0, 0); rect(g, 2, 2, 12, 14, 3); rect(g, 3, 3, 4, 13, 1); rect(g, 9, 3, 4, 13, 1); rect(g, 4, 5, 2, 4, 0); rect(g, 10, 5, 2, 4, 0); });
const waterTile = o => tile(g => { rect(g, 0, 0, 16, 16, 1); for (const [x, y] of [[1, 3], [9, 3], [5, 9], [13, 9]]) { rect(g, (x + o) % 16, y, 3, 1, 0); rect(g, (x + o + 3) % 16, y + 1, 1, 1, 0); } });
T.w = waterTile(0);
const WATER2 = waterTile(2);
const SOLID = new Set('TFSwrRhlndXBCK');

// ---------------------------------------------------------------------------
// Character sprites
// ---------------------------------------------------------------------------
const P_DOWN = [
  '....33333333....', '...3222222223...', '..322220022223..', '..322222222223..',
  '.33333333333333.', '..300000000003..', '..303300003303..', '..300000000003..',
  '...3000000003...', '..332233332233..', '.30322222222303.', '.30322222222303.',
  '..332222222233..', '...3111331113...', '...3333..3333...', '................'];
const P_UP = [
  '....33333333....', '...3222222223...', '..322222222223..', '..322222222223..',
  '..322222222223..', '..333333333333..', '..333333333333..', '..303333333303..',
  '...3300000033...', '..332222222233..', '.30322222222303.', '.30322222222303.',
  '..332222222233..', '...3111331113...', '...3333..3333...', '................'];
const P_LEFT = [
  '.....3333333....', '....322222223...', '...32222222223..', '...32222222223..',
  '.3333333322223..', '...30000003333..', '...30300003033..', '...30000003333..',
  '....3000003333..', '....33222223....', '....32222223....', '....32200223....',
  '....33222233....', '....31111113....', '....3333.333....', '................'];
const OAK_ROWS = [
  '....33333333....', '...3111111113...', '..311111111113..', '..311111111113..',
  '..310000000013..', '..303300003303..', '..300000000003..', '...3000330003...',
  '...3333333333...', '..300022220003..', '.30000222200003.', '.30300222200303.',
  '.33000000000033.', '..300003300003..', '...3223..3223...', '...3333..3333...'];
const STEP_V = { 14: '...3333...33....' };
const STEP_L = { 13: '...3111111113...', 14: '...333....333...' };
const lstep = withRows(P_LEFT, STEP_L);
const PL = {

  up: [sprite(P_UP), sprite(withRows(P_UP, STEP_V)), sprite(mirror(withRows(P_UP, STEP_V)))],

const OAK_BIG = sprite(shade(scale3x(OAK_ROWS)));

const BALL = sprite(['..3333..', '.322223.', '32222223', '33300333', '30000003', '30000003', '.300003.', '..3333..']);
const BALL_FNT = sprite(['..3333..', '.333333.', '33333333', '33300333', '33333333', '33333333', '.333333.', '..3333..']);
const BALL_NONE = sprite(['..3333..', '.3....3.', '3......3', '3......3', '3......3', '3......3', '.3....3.', '..3333..']);

// ---------------------------------------------------------------------------

const SPECIES = {

// Script primitives (async helpers resolved by the frame loop)

const waiters = [];

}
function say(text, opts = {}) {

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
function tick() {
  frame++;
  const A = pressed.A || pressed.START, Bk = pressed.B;
  if (ui.menu) menuInput(A, Bk);
  else if (ui.waitBtn) { if (A || Bk) { const r = ui.waitBtn; ui.waitBtn = null; sfx('blip'); r(); } }
  else if (ui.dialog) dialogInput(A, Bk);

  if (G.scene === 'world') {
    worldUpdate();
    if (!busy && !ui.menu && !ui.dialog && !ui.waitBtn) worldInput();
  }

  const d = ui.dialog;
  if (d) {
    const tot = d.pages[d.page].join('').length;
    if (d.chars < tot) d.chars = Math.min(tot, d.chars + 1);
    if (d.keep && !d.done && d.page === d.pages.length - 1 && d.chars >= tot) { d.done = true; d.res(); }
  }
  if (ui.toastT > 0) ui.toastT--;
  if (ui.evo && ui.evo.flicker && pressed.B) ui.evo.cancel = true;
  mus.want = currentTrack(); musicTick();
  // Periodic autosave: once a minute, whenever the player is standing still in the overworld.
  if (G.scene === 'world' && !busy && P.off === 0 && !ui.menu && !ui.dialog && frame - lastAutoSave >= AUTOSAVE_TICKS) { lastAutoSave = frame; autoSave(); }

  for (let i = waiters.length - 1; i >= 0; i--) if (--waiters[i].n <= 0) waiters.splice(i, 1)[0].r();
  for (const k in pressed) delete pressed[k];
}

  const m = ui.menu, n = m.opts.length, cols = m.cols;
  let i = m.idx;
  if (pressed.up && i - cols >= 0) i -= cols;
  if (pressed.down && i + cols < n) i += cols;
  if (cols > 1) {
    if (pressed.left && i % cols > 0) i--;
    if (pressed.right && i % cols < cols - 1 && i + 1 < n) i++;
  }
  if (i !== m.idx) { m.idx = i; sfx('blip'); }
  if (A) { ui.menu = null; sfx('select'); m.res(m.idx); }
  else if (Bk && m.cancel) { ui.menu = null; sfx('blip'); m.res(-1); }
}
function dialogInput(A, Bk) {

// Overworld
// ---------------------------------------------------------------------------
function worldUpdate() {
  if (P.off > 0) { P.off -= 2; if (P.off <= 0) { P.off = 0; onStep(); } }
}
function worldInput() {
  if (P.off > 0) return;
  if (pressed.START) { run(startMenu); return; }
  if (pressed.A) { interact(); return; }
  // A tap shorter than one frame never shows up in dirStack, so fall back to this frame's presses.
  const d = dirStack[dirStack.length - 1] || Object.keys(DIRS).find(k => pressed[k]);
  if (!d) { P.turn = 0; return; }
  if (d !== G.dir) { G.dir = d; if (pressed[d]) { P.turn = 5; return; } }
  if (P.turn > 0) { P.turn--; return; }

}

  if (G.map === 'town' && !G.flags.starter && dy < 0 && ny <= 19) { run(gate); return; }
  if (SOLID.has(ch) || npcAt(nx, ny)) {
    if (frame - P.lastBump > 18) { sfx('bump'); P.lastBump = frame; }
    const key = `${G.x},${G.y},${d}`;
    if (ch === 'd' && P.doorKey !== key) { P.doorKey = key; run(() => houseDoor(nx)); }
    return;
  }

  G.x = nx; G.y = ny; P.dx = dx; P.dy = dy; P.off = 16; P.steps++;
}
function onStep() {
  const ch = tileAt(G.map, G.x, G.y);
  if (G.map === 'town' && ch === 'D') run(() => warp('lab', 4, 7, 'up'));
  else if (G.map === 'lab' && ch === 'E') run(() => warp('town', 5, 31, 'down'));
  else if (ch === 'G' && G.flags.starter && G.party.some(m => m.hp > 0) && Math.random() < 0.1) run(() => startBattle(rollWild()));
}
async function warp(map, x, y, dir) {
  sfx('door'); await fadeOut();
  G.map = map; G.x = x; G.y = y; G.dir = dir; P.off = 0;
  await fadeIn();
}
function interact() {
  const [dx, dy] = DIRS[G.dir], tx = G.x + dx, ty = G.y + dy, ch = tileAt(G.map, tx, ty);
  if (G.map === 'lab') {
    if (npcAt(tx, ty)) run(talkOak);
    else if (ch === 'K') run(() => checkBall(tx - 3));
    else if (ch === 'B') run(() => say("It's crammed full of POKéMON books!"));
    else if (ch === 'C') run(() => say("It's a PC. There's an e-mail:\n'Catch every POKéMON you can find!' - OAK"));

    if (SIGNS[`${tx},${ty}`]) run(() => say(SIGNS[`${tx},${ty}`]));

const stages = () => ({ atk: 0, def: 0, spd: 0, acc: 0 });
const stageMul = s => s >= 0 ? (2 + s) / 2 : 2 / (2 - s);
const effStat = (p, k) => p.mon[k] * stageMul(p.st[k]);
const nameOf = p => p === B.ally ? p.mon.name : 'Wild ' + p.mon.name;
function rollWild() {
  // Wild Pokémon get a little tougher as your strongest team member levels up.
  const bonus = Math.max(0, Math.floor((Math.max(5, ...G.party.map(m => m.lvl)) - 5) / 3));
  let r = Math.random() * WILD.reduce((s, w) => s + w[1], 0);
  for (const [name, wgt, lo, hi] of WILD) { if ((r -= wgt) < 0) return makeMon(name, rand(lo, hi) + bonus); }
  return makeMon('PIDGEY', 3);
}
async function startBattle(wild) {

  await tween(24, t => { ui.flash = Math.floor(t * 24 / 4) % 2 === 0; });
  ui.flash = false;
  await tween(24, t => { ui.wipe = t; });
  B = { enemy: { mon: wild, st: stages() }, ally: null, eX: -112, eOffY: 0, eVis: true, eHide: false, eInfo: false,
    aX: 0, aOffY: 0, aVis: false, aHide: false, aInfo: false, aPop: 0, ball: null, runTries: 0, lastAct: 0, lastMove: 0, leveled: new Set(),
    tX: 160, showBalls: false };
  G.scene = 'battle'; ui.wipe = 0; ui.battleIntro = false;
  await tween(40, t => { B.eX = Math.round(-112 * (1 - t)); B.tX = Math.round(8 + 152 * (1 - t)); });
  B.eInfo = true; B.showBalls = true;
  await say(`Wild ${wild.name} appeared!`);
  B.showBalls = false;
  await tween(16, t => { B.tX = Math.round(8 - 80 * t); });
  B.tX = null;
  await sendOut(G.party.find(m => m.hp > 0));
  const result = await battleLoop();
  ui.dialog = null;
  await fadeOut();
  const evolving = result === 'won' ? [...B.leveled].filter(m => m.hp > 0 && EVO[m.name] && m.lvl >= EVO[m.name][1]) : [];
  B = null;
  for (const m of evolving) await evolve(m);
  G.scene = 'world';
  if (result === 'lost') {
    G.map = 'town'; G.x = 5; G.y = 24; G.dir = 'down'; P.off = 0; healAll();
    await wait(20); await fadeIn();
    await say(`MOM: Oh, ${G.name}! You look exhausted... Rest up, dear.`);
    sfx('heal'); await say('Your POKéMON were fully healed!');
  } else await fadeIn();
  autoSave();
}
async function evolve(m) {
  const from = m.name, to = EVO[from][0];
  G.scene = 'evolve'; ui.evo = { name: from, flicker: false, cancel: false };
  await fadeIn();
  await say(`What? ${from} is evolving!`, { keep: true });
  // The sprite flickers between forms, faster and faster. Holding or pressing B stops it, like the originals.
  ui.evo.flicker = true;
  for (const n of [28, 24, 20, 18, 16, 14, 12, 10, 9, 8, 7, 6, 5, 5, 4, 4, 3, 3, 3, 2, 2, 2, 2, 2]) {
    ui.evo.name = ui.evo.name === from ? to : from;
    sfx('blip');
    await wait(n);
    if (ui.evo.cancel || held.B) break;
  }
  ui.evo.flicker = false;
  ui.dialog = null;
  if (ui.evo.cancel || held.B) {
    ui.evo.name = from;
    await say(`Huh? ${from} stopped evolving!`);
  } else {
    ui.evo.name = to;
    ui.flash = true; await wait(4); ui.flash = false;
    const oldMax = m.maxhp;
    m.name = to; calcStats(m); m.hp = Math.max(1, m.hp + m.maxhp - oldMax); m.dhp = m.hp;
    sfx('caught');
    await say(`Congratulations! Your ${from} evolved into ${to}!`);

}
async function learnMove(m, mv) {
  if (m.moves.includes(mv)) return;
  if (m.moves.length < 4) { m.moves.push(mv); sfx('levelup'); await say(`${m.name} learned ${mv}!`); return; }
  // Team full of moves: replace a status move first, otherwise the weakest attack.
  let i = m.moves.findIndex(x => !MOVES[x].pow);
  if (i < 0) i = m.moves.reduce((best, x, j) => MOVES[x].pow < MOVES[m.moves[best]].pow ? j : best, 0);
  const old = m.moves[i];
  m.moves[i] = mv; sfx('levelup');
  await say(`${m.name} forgot ${old} and learned ${mv}!`);
}
async function sendOut(mon) {
  B.ally = { mon, st: stages() }; mon.dhp = mon.hp;
  B.aVis = true; B.aHide = false; B.aOffY = 0; B.aX = 0; B.aPop = 0; B.aInfo = false;
  await say(`Go! ${mon.name}!`, { keep: true });
  sfx('throw');
  for (const s of [1 / 3, 2 / 3, 1]) { B.aPop = s; await wait(5); }
  B.aInfo = true; await wait(20); ui.dialog = null;
}
async function withdraw() {
  await say(`Come back, ${B.ally.mon.name}!`, { keep: true });
  B.aInfo = false;
  for (const s of [2 / 3, 1 / 3]) { B.aPop = s; await wait(5); }
  B.aVis = false; await wait(10); ui.dialog = null;
}
async function battleLoop() {
  while (true) {
    const a = B.ally, e = B.enemy;
    const act = await choose(['FIGHT', 'PKMN', 'BALL', 'RUN'], { x: 56, y: 96, w: 104, h: 48, cols: 2, colW: 52, cancel: false, idx: B.lastAct, battle: true });
    B.lastAct = act;
    let move = null;
    if (act === 0) {
      const moves = a.mon.moves;
      const mi = await choose(moves, { x: 32, y: 96, w: 128, h: 48, spacing: 9, idx: Math.min(B.lastMove, moves.length - 1),
        extra: m => { box(0, 64, 88, 32); drawText('TYPE/', 8, 72); drawText(MOVES[moves[m.idx]].type, 16, 82); } });
      if (mi < 0) continue;
      B.lastMove = mi; move = moves[mi];
    } else if (act === 1) {
      const idx = await partyPick(false);
      if (idx < 0) continue;
      const m = G.party[idx];
      if (m === a.mon) { await say(`${m.name} is already out!`); continue; }
      if (m.hp <= 0) { await say("There's no will to fight!"); continue; }
      await withdraw(); await sendOut(m);
    } else if (act === 2) {
      if (G.balls <= 0) { await say("You don't have any POKé BALLs!"); continue; }
      if (await throwBall()) return 'caught';
    } else {
      if (await tryRun()) return 'ran';
    }

    const eMove = pick(e.mon.moves);
    let order;
    if (move) {
      const pp = MOVES[move].prio || 0, ep = MOVES[eMove].prio || 0;
      const as = effStat(B.ally, 'spd'), es = effStat(e, 'spd');
      const allyFirst = pp !== ep ? pp > ep : as !== es ? as > es : Math.random() < 0.5;
      order = allyFirst ? [[B.ally, e, move], [e, B.ally, eMove]] : [[e, B.ally, eMove], [B.ally, e, move]];
    } else order = [[e, B.ally, eMove]];

    for (const [u, t, mv] of order) {
      if (u.mon.hp <= 0 || t.mon.hp <= 0) continue;
      await useMove(u, t, mv);
      if (e.mon.hp <= 0) { await enemyFainted(); return 'won'; }
      if (B.ally.mon.hp <= 0) { if ((await allyFainted()) === 'blackout') return 'lost'; break; }
    }
  }
}
async function lunge(isAlly) {
  await tween(6, t => { const o = Math.round(Math.sin(t * Math.PI) * 8); if (isAlly) B.aX = o; else B.eX = -o; });
}
async function blink(isAlly) {
  for (let i = 0; i < 6; i++) { if (isAlly) B.aHide = !B.aHide; else B.eHide = !B.eHide; await wait(4); }
  B.aHide = B.eHide = false;
}
async function shake(isAlly) {
  await tween(16, t => { const o = Math.round(t * 16) % 4 < 2 ? 2 : -2; if (isAlly) B.aX = o; else B.eX = o; });
  B.aX = B.eX = 0;
}
async function drainHP(m) {
  const step = Math.max(1, Math.round(m.maxhp / 48));
  while (m.dhp !== m.hp) { m.dhp = m.dhp > m.hp ? Math.max(m.hp, m.dhp - step) : Math.min(m.hp, m.dhp + step); await wait(2); }
}
async function useMove(u, t, mv) {
  const M = MOVES[mv], isAlly = u === B.ally;
  await say(`${nameOf(u)} used ${mv}!`, { keep: true });
  await wait(8);
  if (M.self) {
    sfx('stat'); await wait(10);
    ui.dialog = null;
    if (u.st[M.self] >= 6) await say('Nothing happened!');
    else { u.st[M.self] = Math.min(6, u.st[M.self] + M.amt); await say(`${nameOf(u)}'s ${STAT_NAME[M.self]} ${M.amt > 1 ? 'greatly rose' : 'rose'}!`); }
    return;
  }
  const accMul = u.st.acc >= 0 ? (3 + u.st.acc) / 3 : 3 / (3 - u.st.acc);
  if (Math.random() * 100 >= M.acc * accMul) { ui.dialog = null; await say(`${nameOf(u)}'s attack missed!`); return; }
  await lunge(isAlly);
  if (M.pow) {

    const L = u.mon.lvl * (crit ? 2 : 1);

    t.mon.hp = Math.max(0, t.mon.hp - dmg);
    await drainHP(t.mon);

  } else {
    const st = M.stat;

    ui.dialog = null;

    else { t.st[st]--; await say(`${nameOf(t)}'s ${STAT_NAME[st]} fell!`); }
  }
  ui.dialog = null;
}
async function enemyFainted() {
  const e = B.enemy.mon, a = B.ally.mon;

  await tween(16, t => { B.eOffY = Math.round(48 * t); });
  B.eVis = false; B.eInfo = false; B.victory = true;
  await say(`Wild ${e.name} fainted!`);

}
async function allyFainted() {

}
async function tryRun() {

async function throwBall() {
  const m = B.enemy.mon;

  sfx('throw');
  B.ball = { x: 24, y: 88, wob: 0 };

    await say(`All right! ${m.name} was caught!`);

const SAVE_KEY = 'pokemon-simple-game-save-v1';
const AUTOSAVE_TICKS = 60 * 60;
let lastAutoSave = 0;
const strip = m => ({ name: m.name, lvl: m.lvl, exp: m.exp, hp: m.hp, moves: m.moves });
const autosaveOn = () => G.flags.autosave !== false;
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} hr ago`; };
function saveGame() {
  try {
    G.savedAt = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify({ name: G.name, party: G.party.map(strip), box: G.box.map(strip), balls: G.balls, flags: G.flags, map: G.map, x: G.x, y: G.y, dir: G.dir, savedAt: G.savedAt }));

}
function autoSave() {

}
// Closing the tab, switching apps or locking the phone saves too.
const quickSave = () => { if (G.flags.started && autosaveOn() && G.scene !== 'evolve') saveGame(); };
addEventListener('pagehide', quickSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') quickSave(); });
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d || !Array.isArray(d.party)) return false;
    Object.assign(G, newState(), d);
    for (const m of [...G.party, ...G.box]) { calcStats(m); m.hp = Math.min(m.hp, m.maxhp); m.dhp = m.hp; }
    // A save taken mid-battle could have every Pokémon fainted; wake up at home instead.
    if (G.party.length && !G.party.some(m => m.hp > 0)) { healAll(); G.map = 'town'; G.x = 5; G.y = 24; G.dir = 'down'; }
    G.flags.started = true;
    return true;
  } catch (e) { return false; }
}

// ---------------------------------------------------------------------------
// Title & intro
// ---------------------------------------------------------------------------
async function main() {
  while (true) {
    G = newState(); P.off = 0;
    await fadeIn();
    await waitButton();
    sfx('select');
    if (hasSave()) {
      const i = await choose(['NEW GAME', 'CONTINUE'], { x: 36, y: 100, w: 88, h: 40, cancel: false });
      if (i === 1 && loadGame()) { await fadeOut(); G.scene = 'world'; await fadeIn(); return; }
    }
    await fadeOut();
    await intro();
    return;
  }
}
async function intro() {
  G = newState(); G.scene = 'intro';
  await fadeIn();
  await say('Hello there! Welcome to the world of POKéMON!');
  await say('My name is OAK! People call me the POKéMON PROF!');
  ui.introMon = 'PIKACHU';
  await say('This world is inhabited by creatures called POKéMON!');
  await say('For some people, POKéMON are pets. Others use them for battles.');
  ui.introMon = null;
  await say('First, what is your name?', { keep: true });
  const names = ['RED', 'ASH', 'JACK', 'ZAYN'];
  const n = await choose(names, { x: 0, y: 8, w: 56, h: 72, cancel: false });
  ui.dialog = null;
  G.name = names[n];
  await say(`Right! So your name is ${G.name}!`);
  await say(`${G.name}! Your very own POKéMON legend is about to unfold!`);
  await say('Come and see me at my LAB. It is just south of your house!');
  await fadeOut();
  G.scene = 'world';
  await fadeIn();
  G.flags.started = true;
  await say("Today's the day! PROF. OAK is waiting at his LAB, the big building to the south.");
  autoSave();
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function fit() {
  const extraW = 112, extraH = document.getElementById('shell').offsetHeight - cv.offsetHeight + document.getElementById('hint').offsetHeight + 48;
  const s0 = Math.min((innerWidth - extraW) / 160, (innerHeight - extraH) / 144);
  const s = s0 >= 2 ? Math.floor(s0) : Math.max(1, s0);
  cv.style.width = Math.floor(160 * s) + 'px';
  cv.style.height = Math.floor(144 * s) + 'px';
}
addEventListener('resize', fit);
fit();

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
ui.fade = 1;
requestAnimationFrame(loop);
run(main);
</script>
</body>
</html>
