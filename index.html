<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1b2620">
<title>Pokémon Simple Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b2620; color: #d9e4cf; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 16px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .shell { touch-action: none; -webkit-touch-callout: none; background: #cbc6ba; border-radius: 14px 14px 52px 14px; padding: 18px 18px 22px; box-shadow: 0 12px 30px rgba(0,0,0,.5), inset -4px -6px 0 #a7a296; }
  .bezel { background: #4f5263; border-radius: 10px 10px 32px 10px; padding: 18px 22px 20px; }
  canvas { display: block; width: 320px; height: 288px; image-rendering: pixelated; image-rendering: crisp-edges; background: #e0f8d0; }
  .label { margin-top: 10px; text-align: center; font: italic 700 13px/1 system-ui, sans-serif; letter-spacing: 2px; color: #2c3a8c; }
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 0 4px; }
  .dpad { position: relative; width: 150px; height: 150px; touch-action: none; }
  .dpad button, .dpad span { position: absolute; width: 50px; height: 50px; background: #2a2a2e; border: 0; padding: 0; pointer-events: none; }
  .dpad .up { left: 50px; top: 0; border-radius: 6px 6px 0 0; }
  .dpad .down { left: 50px; bottom: 0; border-radius: 0 0 6px 6px; }
  .dpad .left { left: 0; top: 50px; border-radius: 6px 0 0 6px; }
  .dpad .right { right: 0; top: 50px; border-radius: 0 6px 6px 0; }
  .dpad span { left: 50px; top: 50px; }
  .dpad span::after { content: ''; position: absolute; inset: 15px; border-radius: 50%; background: #1f1f22; }
  .dpad button::after { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: translate(-50%, -50%); border: 7px solid transparent; }
  .dpad .up::after { border-bottom-color: #4a4a50; margin-top: -4px; }
  .dpad .down::after { border-top-color: #4a4a50; margin-top: 4px; }
  .dpad .left::after { border-right-color: #4a4a50; margin-left: -4px; }
  .dpad .right::after { border-left-color: #4a4a50; margin-left: 4px; }
  .ab { display: flex; gap: 16px; transform: rotate(-25deg); }
  .ab button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #9a2352; color: #f3d6e1; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 #5e1431; }
  .ss { display: flex; justify-content: center; gap: 22px; margin-top: 18px; }
  .ss button { width: 50px; height: 12px; border-radius: 6px; border: 0; background: #77767c; transform: rotate(-25deg); position: relative; }
  .ss button::after { content: attr(data-label); position: absolute; top: 16px; left: 0; right: 0; font-size: 9px; font-weight: 700; color: #3b3f73; letter-spacing: 1px; }
  button { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: none; }
  button:active, button.on { filter: brightness(0.75); }
  .hint { margin-top: 14px; font-size: 13px; opacity: .75; text-align: center; line-height: 1.5; }
  kbd { background: #2d3a32; border-radius: 4px; padding: 1px 5px; font-family: inherit; }
  @media (hover: hover) and (pointer: fine) { .controls, .ss { display: none; } }
  @media (hover: none), (pointer: coarse) { .hint { display: none; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="bezel">
    <canvas id="screen" width="160" height="144"></canvas>
  </div>
  <div class="label">POCKET MONSTER</div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-key="up" aria-label="Up"></button>
      <button class="left" data-key="left" aria-label="Left"></button>
      <span></span>
      <button class="right" data-key="right" aria-label="Right"></button>
      <button class="down" data-key="down" aria-label="Down"></button>
    </div>
    <div class="ab">
      <button data-key="B">B</button>
      <button data-key="A">A</button>
    </div>
  </div>
  <div class="ss">
    <button data-key="SELECT" data-label="SOUND" aria-label="Toggle sound"></button>
    <button data-key="START" data-label="START" aria-label="Start"></button>
  </div>
</div>
<div class="hint" id="hint">
  <kbd>←↑↓→</kbd> move &nbsp; <kbd>Z</kbd>/<kbd>Space</kbd> A (talk, confirm) &nbsp; <kbd>X</kbd> B (back)<br>
  <kbd>Enter</kbd> START (menu) &nbsp; <kbd>M</kbd> sound: all / effects only / off
</div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// Palette & drawing helpers (classic 4-shade green Game Boy palette)
// ---------------------------------------------------------------------------
const C = ['#e0f8d0', '#88c070', '#346856', '#081820'];
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rect(g, x, y, w, h, c) { g.fillStyle = C[c]; g.fillRect(x, y, w, h); }
function blit(g, rows, ox = 0, oy = 0) {
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] !== '.') rect(g, ox + x, oy + y, 1, 1, +r[x]); });
}
function sprite(rows) { const c = mk(rows[0].length, rows.length); blit(c.getContext('2d'), rows); return c; }
const mirror = rows => rows.map(r => [...r].reverse().join(''));
const withRows = (rows, repl) => rows.map((r, i) => repl[i] !== undefined ? repl[i] : r);
const recolor = (rows, map) => rows.map(r => [...r].map(c => map[c] ?? c).join(''));
function drawSprite(img, x, y, sc = 1, flip = false) {
  const w = img.width * sc, h = img.height * sc;
  x = Math.round(x); y = Math.round(y);
  if (flip) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, w, h); ctx.restore(); }
  else ctx.drawImage(img, x, y, w, h);
}

// ---------------------------------------------------------------------------
// 5x7 bitmap font
// ---------------------------------------------------------------------------
const FONT = {
  A: '.xxx. x...x x...x xxxxx x...x x...x x...x', B: 'xxxx. x...x x...x xxxx. x...x x...x xxxx.',
  C: '.xxx. x...x x.... x.... x.... x...x .xxx.', D: 'xxxx. x...x x...x x...x x...x x...x xxxx.',
  E: 'xxxxx x.... x.... xxxx. x.... x.... xxxxx', F: 'xxxxx x.... x.... xxxx. x.... x.... x....',
  G: '.xxx. x...x x.... x.xxx x...x x...x .xxxx', H: 'x...x x...x x...x xxxxx x...x x...x x...x',
  I: '.xxx. ..x.. ..x.. ..x.. ..x.. ..x.. .xxx.', J: '..xxx ...x. ...x. ...x. ...x. x..x. .xx..',
  K: 'x...x x..x. x.x.. xx... x.x.. x..x. x...x', L: 'x.... x.... x.... x.... x.... x.... xxxxx',
  M: 'x...x xx.xx x.x.x x.x.x x...x x...x x...x', N: 'x...x x...x xx..x x.x.x x..xx x...x x...x',
  O: '.xxx. x...x x...x x...x x...x x...x .xxx.', P: 'xxxx. x...x x...x xxxx. x.... x.... x....',
  Q: '.xxx. x...x x...x x...x x.x.x x..x. .xx.x', R: 'xxxx. x...x x...x xxxx. x.x.. x..x. x...x',
  S: '.xxxx x.... x.... .xxx. ....x ....x xxxx.', T: 'xxxxx ..x.. ..x.. ..x.. ..x.. ..x.. ..x..',
  U: 'x...x x...x x...x x...x x...x x...x .xxx.', V: 'x...x x...x x...x x...x x...x .x.x. ..x..',
  W: 'x...x x...x x...x x.x.x x.x.x x.x.x .x.x.', X: 'x...x x...x .x.x. ..x.. .x.x. x...x x...x',
  Y: 'x...x x...x .x.x. ..x.. ..x.. ..x.. ..x..', Z: 'xxxxx ....x ...x. ..x.. .x... x.... xxxxx',
  0: '.xxx. x...x x..xx x.x.x xx..x x...x .xxx.', 1: '..x.. .xx.. ..x.. ..x.. ..x.. ..x.. .xxx.',
  2: '.xxx. x...x ....x ...x. ..x.. .x... xxxxx', 3: 'xxxxx ...x. ..x.. ...x. ....x x...x .xxx.',
  4: '...x. ..xx. .x.x. x..x. xxxxx ...x. ...x.', 5: 'xxxxx x.... xxxx. ....x ....x x...x .xxx.',
  6: '..xx. .x... x.... xxxx. x...x x...x .xxx.', 7: 'xxxxx ....x ...x. ..x.. .x... .x... .x...',
  8: '.xxx. x...x x...x .xxx. x...x x...x .xxx.', 9: '.xxx. x...x x...x .xxxx ....x ...x. .xx..',
  '.': '..... ..... ..... ..... ..... .xx.. .xx..', ',': '..... ..... ..... ..... .xx.. ..x.. .x...',
  '!': '..x.. ..x.. ..x.. ..x.. ..x.. ..... ..x..', '?': '.xxx. x...x ....x ...x. ..x.. ..... ..x..',
  "'": '..x.. ..x.. .x... ..... ..... ..... .....', '-': '..... ..... ..... xxxxx ..... ..... .....',
  ':': '..... .xx.. .xx.. ..... .xx.. .xx.. .....', '/': '....x ...x. ...x. ..x.. .x... .x... x....',
  '(': '...x. ..x.. .x... .x... .x... ..x.. ...x.', ')': '.x... ..x.. ...x. ...x. ...x. ..x.. .x...',
  'é': '...x. ..x.. .xxx. x...x xxxxx x.... .xxx.',
  '¥': 'x...x .x.x. xxxxx ..x.. xxxxx ..x.. ..x..',
  '▶': 'x.... xx... xxx.. xxxx. xxx.. xx... x....',
  '▼': '..... ..... xxxxx .xxx. ..x.. ..... .....',
};
// Glyphs are stored 5 wide for readability and widened to 7 (in an 8px cell, like the Game Boy font).
const CW = 8, WIDEN = [0, 1, 1, 2, 3, 3, 4];
const GLYPH = {};
function glyph(c, col) {
  const k = c + col;
  if (k in GLYPH) return GLYPH[k];
  const src = FONT[c];
  if (!src) return (GLYPH[k] = null);
  const g = mk(7, 7), gc = g.getContext('2d');
  src.split(' ').map(r => WIDEN.map(i => r[i]).join('')).forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'x') rect(gc, x, y, 1, 1, col); }));
  return (GLYPH[k] = g);
}
const norm = c => (c === 'é' || c === 'É') ? 'é' : c.toUpperCase();
function drawText(s, x, y, col = 3, sc = 1) {
  let cx = x;
  for (const ch of String(s)) {
    if (ch !== ' ') { const g = glyph(norm(ch), col); if (g) ctx.drawImage(g, cx, y, 7 * sc, 7 * sc); }
    cx += CW * sc;
  }
}
const centerText = (s, y, col = 3, sc = 1) => drawText(s, Math.round((160 - (s.length * CW - 1) * sc) / 2), y, col, sc);
function box(x, y, w, h) { rect(ctx, x, y, w, h, 3); rect(ctx, x + 1, y + 1, w - 2, h - 2, 0); rect(ctx, x + 2, y + 2, w - 4, h - 4, 3); rect(ctx, x + 3, y + 3, w - 6, h - 6, 0); }

// ---------------------------------------------------------------------------
// Tiles (16x16)
// ---------------------------------------------------------------------------
function tile(fn) { const c = mk(16, 16); fn(c.getContext('2d')); return c; }
function lawn(g) { rect(g, 0, 0, 16, 16, 0); for (const [x, y] of [[2, 2], [10, 5], [4, 10], [12, 12]]) { rect(g, x, y, 1, 1, 1); rect(g, x + 2, y, 1, 1, 1); rect(g, x + 1, y + 1, 1, 1, 1); } }
function floor(g) { rect(g, 0, 0, 16, 16, 0); rect(g, 0, 0, 16, 1, 1); rect(g, 0, 8, 16, 1, 1); rect(g, 0, 0, 1, 16, 1); rect(g, 8, 0, 1, 16, 1); }
const TALL = ['11111111', '13111311', '32313231', '22222222', '11111111', '11131113', '31323132', '22222222'];
const TREE = [
  '.....333333.....', '...3322222233...', '..322121222223..', '.32211112212223.',
  '.32111122222223.', '3221112222122223', '3222222221112223', '3222122222111223',
  '3222111222222223', '.32221112222223.', '.33222222222233.', '..333222222333..',
  '....33333333....', '......3113......', '......3113......', '.....331133.....'];
const T = {
  '.': tile(lawn),
  ',': tile(g => { rect(g, 0, 0, 16, 16, 0); for (let y = 1; y < 16; y += 4) for (let x = (y % 8 === 1 ? 1 : 3); x < 16; x += 4) rect(g, x, y, 1, 1, 1); }),
  'G': tile(g => { for (let y = 0; y < 16; y += 8) for (let x = 0; x < 16; x += 8) blit(g, TALL, x, y); }),
  'T': tile(g => { rect(g, 0, 0, 16, 16, 0); blit(g, TREE); }),
  'f': tile(g => { rect(g, 0, 0, 16, 16, 0); for (const [x, y] of [[2, 2], [10, 3], [5, 10], [12, 11]]) { rect(g, x + 1, y, 1, 1, 2); rect(g, x, y + 1, 1, 1, 2); rect(g, x + 2, y + 1, 1, 1, 2); rect(g, x + 1, y + 2, 1, 1, 2); rect(g, x + 1, y + 1, 1, 1, 3); } }),
  'F': tile(g => { lawn(g); rect(g, 0, 4, 16, 2, 2); rect(g, 0, 4, 16, 1, 3); rect(g, 0, 10, 16, 2, 2); rect(g, 0, 10, 16, 1, 3); rect(g, 3, 2, 3, 12, 3); rect(g, 4, 3, 1, 10, 1); rect(g, 11, 2, 3, 12, 3); rect(g, 12, 3, 1, 10, 1); }),
  'S': tile(g => { lawn(g); rect(g, 7, 10, 2, 6, 3); rect(g, 1, 2, 14, 9, 3); rect(g, 2, 3, 12, 7, 1); rect(g, 4, 5, 8, 1, 2); rect(g, 4, 7, 6, 1, 2); }),
  'r': tile(g => { rect(g, 0, 0, 16, 16, 2); rect(g, 0, 0, 16, 1, 1); for (let b = 0; b < 4; b++) { rect(g, 0, b * 4 + 3, 16, 1, 3); for (let x = (b % 2 ? 0 : 4); x < 16; x += 8) rect(g, x, b * 4, 1, 3, 3); } }),
  'h': tile(g => { rect(g, 0, 0, 16, 16, 0); for (const y of [3, 7, 11]) rect(g, 0, y, 16, 1, 1); rect(g, 0, 15, 16, 1, 2); }),
  'R': tile(g => { rect(g, 0, 0, 16, 16, 1); for (let x = 1; x < 16; x += 4) rect(g, x, 0, 1, 15, 2); rect(g, 0, 15, 16, 1, 3); }),
  'l': tile(g => { rect(g, 0, 0, 16, 16, 0); rect(g, 0, 0, 1, 15, 1); rect(g, 8, 0, 1, 15, 1); rect(g, 0, 15, 16, 1, 2); }),
  '_': tile(floor),
  'X': tile(g => { rect(g, 0, 0, 16, 16, 0); for (let x = 1; x < 16; x += 4) rect(g, x, 0, 2, 12, 1); rect(g, 0, 12, 16, 1, 3); rect(g, 0, 13, 16, 3, 2); }),
  'B': tile(g => { rect(g, 0, 0, 16, 16, 3); for (let s = 0; s < 3; s++) for (let x = 1; x < 15; x += 2) rect(g, x, 1 + s * 5, 1, 4, [0, 1, 2, 1, 0, 2, 1][(x + s) % 7]); }),
  'C': tile(g => { rect(g, 0, 0, 16, 16, 3); rect(g, 1, 1, 14, 14, 1); rect(g, 3, 2, 10, 7, 3); rect(g, 4, 3, 8, 5, 0); rect(g, 5, 4, 5, 1, 2); rect(g, 5, 6, 3, 1, 2); rect(g, 3, 11, 2, 2, 3); rect(g, 7, 11, 2, 2, 3); rect(g, 11, 11, 2, 2, 2); }),
  'K': tile(g => { floor(g); rect(g, 0, 3, 16, 10, 3); rect(g, 0, 4, 16, 8, 1); rect(g, 0, 4, 16, 1, 0); rect(g, 2, 13, 2, 3, 3); rect(g, 12, 13, 2, 3, 3); }),
  'E': tile(g => { floor(g); rect(g, 1, 3, 14, 10, 2); rect(g, 1, 5, 14, 1, 3); rect(g, 1, 9, 14, 1, 3); }),
};
T.n = tile(g => { g.drawImage(T.h, 0, 0); rect(g, 3, 3, 10, 9, 3); rect(g, 4, 4, 8, 7, 1); rect(g, 8, 4, 1, 7, 3); rect(g, 4, 7, 8, 1, 3); rect(g, 5, 5, 2, 1, 0); });
T.d = tile(g => { g.drawImage(T.h, 0, 0); rect(g, 3, 3, 10, 13, 3); rect(g, 4, 4, 8, 12, 2); rect(g, 10, 10, 1, 1, 0); });
T.D = tile(g => { g.drawImage(T.l, 0, 0); rect(g, 2, 2, 12, 14, 3); rect(g, 3, 3, 4, 13, 1); rect(g, 9, 3, 4, 13, 1); rect(g, 4, 5, 2, 4, 0); rect(g, 10, 5, 2, 4, 0); });
const waterTile = o => tile(g => { rect(g, 0, 0, 16, 16, 1); for (const [x, y] of [[1, 3], [9, 3], [5, 9], [13, 9]]) { rect(g, (x + o) % 16, y, 3, 1, 0); rect(g, (x + o + 3) % 16, y + 1, 1, 1, 0); } });
T.w = waterTile(0);
const WATER2 = waterTile(2);
T.c = tile(g => { rect(g, 0, 0, 16, 16, 2); rect(g, 0, 0, 16, 1, 1); for (const y of [4, 9]) rect(g, 0, y, 16, 1, 3); rect(g, 0, 14, 16, 2, 3); }); // Poké Center roof
T.m = tile(g => { rect(g, 0, 0, 16, 16, 1); for (let x = 0; x < 16; x += 4) rect(g, x, 0, 2, 14, 2); rect(g, 0, 14, 16, 2, 3); });   // Poké Mart roof
T.Q = tile(g => { g.drawImage(T.l, 0, 0); rect(g, 2, 2, 12, 11, 3); rect(g, 3, 3, 10, 9, 0); rect(g, 6, 4, 1, 7, 3); rect(g, 7, 4, 3, 1, 3); rect(g, 9, 5, 1, 2, 3); rect(g, 7, 7, 3, 1, 3); }); // "P" sign
T.M = tile(g => { g.drawImage(T.l, 0, 0); rect(g, 2, 2, 12, 11, 3); rect(g, 3, 3, 10, 9, 1); rect(g, 5, 4, 1, 7, 3); rect(g, 10, 4, 1, 7, 3); rect(g, 6, 5, 1, 1, 3); rect(g, 9, 5, 1, 1, 3); rect(g, 7, 6, 2, 1, 3); }); // "M" sign
T.k = tile(g => { floor(g); rect(g, 0, 2, 16, 12, 3); rect(g, 0, 3, 16, 10, 1); rect(g, 0, 3, 16, 2, 0); }); // shop counter
T.v = tile(g => { rect(g, 0, 0, 16, 16, 0); for (const [x, y] of [[3, 2], [11, 4], [6, 9], [13, 12], [2, 13], [9, 14]]) rect(g, x, y, 1, 1, 1); rect(g, 7, 5, 2, 1, 1); }); // cave floor
T.V = tile(g => { rect(g, 0, 0, 16, 16, 2); rect(g, 0, 0, 16, 1, 1); rect(g, 0, 15, 16, 1, 3); for (const [x, y, w] of [[2, 4, 4], [9, 3, 5], [5, 9, 6], [11, 11, 3], [1, 12, 3]]) { rect(g, x, y, w, 1, 3); rect(g, x, y - 1, w - 1, 1, 1); } }); // rock wall
T.Y = tile(g => { g.drawImage(T.V, 0, 0); rect(g, 3, 4, 10, 12, 3); rect(g, 4, 3, 8, 1, 3); }); // cave mouth
T.O = tile(g => { floor(g); rect(g, 2, 3, 12, 11, 3); rect(g, 3, 2, 10, 13, 3); rect(g, 3, 4, 10, 9, 2); rect(g, 4, 3, 8, 2, 1); rect(g, 6, 8, 3, 1, 3); }); // boulder
const SOLID = new Set('TFSwrRhlndXBCKcmQMkVO');

// ---------------------------------------------------------------------------
// Character sprites
// ---------------------------------------------------------------------------
const P_DOWN = [
  '....33333333....', '...3222222223...', '..322220022223..', '..322222222223..',
  '.33333333333333.', '..300000000003..', '..303300003303..', '..300000000003..',
  '...3000000003...', '..332233332233..', '.30322222222303.', '.30322222222303.',
  '..332222222233..', '...3111331113...', '...3333..3333...', '................'];
const P_UP = [
  '....33333333....', '...3222222223...', '..322222222223..', '..322222222223..',
  '..322222222223..', '..333333333333..', '..333333333333..', '..303333333303..',
  '...3300000033...', '..332222222233..', '.30322222222303.', '.30322222222303.',
  '..332222222233..', '...3111331113...', '...3333..3333...', '................'];
const P_LEFT = [
  '.....3333333....', '....322222223...', '...32222222223..', '...32222222223..',
  '.3333333322223..', '...30000003333..', '...30300003033..', '...30000003333..',
  '....3000003333..', '....33222223....', '....32222223....', '....32200223....',
  '....33222233....', '....31111113....', '....3333.333....', '................'];
const OAK_ROWS = [
  '....33333333....', '...3111111113...', '..311111111113..', '..311111111113..',
  '..310000000013..', '..303300003303..', '..300000000003..', '...3000330003...',
  '...3333333333...', '..300022220003..', '.30000222200003.', '.30300222200303.',
  '.33000000000033.', '..300003300003..', '...3223..3223...', '...3333..3333...'];
const STEP_V = { 14: '...3333...33....' };
const STEP_L = { 13: '...3111111113...', 14: '...333....333...' };
const lstep = withRows(P_LEFT, STEP_L);
const PL = {
  down: [sprite(P_DOWN), sprite(withRows(P_DOWN, STEP_V)), sprite(mirror(withRows(P_DOWN, STEP_V)))],
  up: [sprite(P_UP), sprite(withRows(P_UP, STEP_V)), sprite(mirror(withRows(P_UP, STEP_V)))],
  left: [sprite(P_LEFT), sprite(lstep), sprite(lstep)],
  right: [sprite(mirror(P_LEFT)), sprite(mirror(lstep)), sprite(mirror(lstep))],
};
const OAK = sprite(OAK_ROWS);
const BLUE_ROWS = [
  '..3.3.3333.3.3..', '..313311113313..', '..311111111113..', '.31111111111113.', '.31133333333113.',
  ...P_DOWN.slice(5, 9), ...recolor(P_DOWN.slice(9), { 2: '1', 1: '2' })];
const NURSE_ROWS = [

function scaleShapes(shapes, k) {
  return shapes.flat().map(sh => sh.t === 'e' ? { ...sh, cx: sh.cx * k, cy: sh.cy * k, rx: Math.max(0.7, sh.rx * k), ry: Math.max(0.7, sh.ry * k) }
    : sh.t === 'p' ? { ...sh, pts: sh.pts.map(v => v * k) }
    : sh.t === 'l' ? { ...sh, x1: sh.x1 * k, y1: sh.y1 * k, x2: sh.x2 * k, y2: sh.y2 * k }
    : { ...sh, x: Math.round(sh.x * k), y: Math.round(sh.y * k) });
}

const held = {}, pressed = {};

// ---------------------------------------------------------------------------
// Script primitives (async helpers resolved by the frame loop)

const waiters = [];

    let line = '';

      else { out.push(line); line = w; }
    }
    out.push(line);
  }

}
function say(text, opts = {}) {

    const lines = wrap(text, 18), pages = [];
    for (let i = 0; i < lines.length; i += 2) pages.push(lines.slice(i, i + 2));
    ui.dialog = { pages, page: 0, chars: 0, res, keep: !!opts.keep, done: false };
  });
}
function choose(opts, o = {}) {
  return new Promise(res => {
    const spacing = o.spacing || 16;
    const w = o.w || 24 + Math.max(...opts.map(s => s.length)) * CW;
    const h = o.h || 8 + opts.length * spacing;
    ui.menu = { opts, res, idx: o.idx || 0, cols: o.cols || 1, cancel: o.cancel !== false, spacing, w, h,
      x: o.x ?? 160 - w, y: o.y ?? 96 - h, colW: o.colW, draw: o.draw, extra: o.extra, battle: o.battle };

const waitButton = () => new Promise(r => { ui.waitBtn = r; });

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
function tick() {
  frame++;
  const A = pressed.A || pressed.START, Bk = pressed.B;
  if (ui.qty) {
    const q = ui.qty, step = (pressed.up ? 1 : 0) - (pressed.down ? 1 : 0) + (pressed.right ? 10 : 0) - (pressed.left ? 10 : 0);
    if (step) { q.n = ((q.n - 1 + step) % q.max + q.max) % q.max + 1; sfx('blip'); }
    if (A || Bk) { ui.qty = null; sfx('select'); q.res(A ? q.n : 0); }
  } else if (ui.menu) menuInput(A, Bk);
  else if (ui.waitBtn) { if (A || Bk) { const r = ui.waitBtn; ui.waitBtn = null; sfx('blip'); r(); } }
  else if (ui.dialog) dialogInput(A, Bk);

  if (G.scene === 'world') {
    worldUpdate();
    if (!busy && !ui.menu && !ui.dialog && !ui.waitBtn) worldInput();
  }

  const d = ui.dialog;
  if (d) {
    const tot = d.pages[d.page].join('').length;
    if (d.chars < tot) d.chars = Math.min(tot, d.chars + 1);
    if (d.keep && !d.done && d.page === d.pages.length - 1 && d.chars >= tot) { d.done = true; d.res(); }
  }
  if (ui.toastT > 0) ui.toastT--;
  if (ui.evo && ui.evo.flicker && pressed.B) ui.evo.cancel = true;
  mus.want = currentTrack(); musicTick();
  // Periodic autosave: once a minute, whenever the player is standing still in the overworld.
  if (G.scene === 'world' && !busy && P.off === 0 && !ui.menu && !ui.dialog && frame - lastAutoSave >= AUTOSAVE_TICKS) { lastAutoSave = frame; autoSave(); }

  for (let i = waiters.length - 1; i >= 0; i--) if (--waiters[i].n <= 0) waiters.splice(i, 1)[0].r();
  for (const k in pressed) delete pressed[k];
}
function menuInput(A, Bk) {
  const m = ui.menu, n = m.opts.length, cols = m.cols;
  let i = m.idx;
  if (pressed.up && i - cols >= 0) i -= cols;
  if (pressed.down && i + cols < n) i += cols;
  if (cols > 1) {
    if (pressed.left && i % cols > 0) i--;
    if (pressed.right && i % cols < cols - 1 && i + 1 < n) i++;
  }
  if (i !== m.idx) { m.idx = i; sfx('blip'); }
  if (A) { ui.menu = null; sfx('select'); m.res(m.idx); }
  else if (Bk && m.cancel) { ui.menu = null; sfx('blip'); m.res(-1); }
}
function dialogInput(A, Bk) {
  const d = ui.dialog, last = d.page === d.pages.length - 1, tot = d.pages[d.page].join('').length;
  if (d.chars < tot) { if (A) d.chars = tot; return; }
  if (d.keep && last) return;
  if (A || Bk) {
    sfx('blip');
    if (!last) { d.page++; d.chars = 0; } else { ui.dialog = null; d.res(); }
  }
}

function worldUpdate() {

}

  if (pressed.A) { interact(); return; }
  // A tap shorter than one frame never shows up in dirStack, so fall back to this frame's presses.
  const d = dirStack[dirStack.length - 1] || Object.keys(DIRS).find(k => pressed[k]);

}

  // Walking off the edge of a map into the next one.

    run(() => warp(to, tx, ty, d, true)); return;
  }
  if (SOLID.has(ch) || npcAt(nx, ny)) {
    if (frame - P.lastBump > 18) { sfx('bump'); P.lastBump = frame; }
    const key = `${G.x},${G.y},${d}`;
    if (ch === 'd' && P.doorKey !== key) { P.doorKey = key; run(() => houseDoor(nx)); }
    return;

}
function onStep() {

      const x = n.x + dx * k, y = n.y + dy * k;

  // Wild Pokémon get a little tougher when your strongest team member is well above the area's level.
  const table = WILD[G.map] || WILD.town, top = Math.max(...table.map(w => w[3]));
  const bonus = Math.max(0, Math.floor((Math.max(5, ...G.party.map(m => m.lvl)) - top - 2) / 3));
  let r = Math.random() * table.reduce((s, w) => s + w[1], 0);
  for (const [name, wgt, lo, hi] of table) { if ((r -= wgt) < 0) return makeMon(name, rand(lo, hi) + bonus); }
  return makeMon('PIDGEY', 3);
}

async function evolve(m) {

async function learnMove(m, mv) {

  // Team full of moves: replace a status move first, otherwise the weakest attack.
  let i = m.moves.findIndex(x => !MOVES[x].pow);
  if (i < 0) i = m.moves.reduce((best, x, j) => MOVES[x].pow < MOVES[m.moves[best]].pow ? j : best, 0);
  const old = m.moves[i];

}

async function battleLoop() {
  while (true) {
    const a = B.ally, e = B.enemy;
    const act = await choose(['FIGHT', 'PKMN', 'ITEM', 'RUN'], { x: 56, y: 96, w: 104, h: 48, cols: 2, colW: 52, cancel: false, idx: B.lastAct, battle: true });
    B.lastAct = act;

    if (act === 0) {

      if (mon.pp.every(x => x <= 0)) { await say(`${mon.name} has no moves left!`); move = 'STRUGGLE'; }
      else {
        const mi = await choose(moves, { x: 32, y: 96, w: 128, h: 48, spacing: 9, idx: Math.min(B.lastMove, moves.length - 1),
          extra: m => { box(0, 60, 88, 36); drawText('TYPE/', 8, 64); drawText(MOVES[moves[m.idx]].type, 16, 73); drawText(`PP ${String(mon.pp[m.idx]).padStart(2)}/${MOVES[moves[m.idx]].pp}`, 8, 83); } });
        if (mi < 0) continue;

    } else {

    const eMove = pick(e.mon.moves);

      const allyFirst = pp !== ep ? pp > ep : as !== es ? as > es : Math.random() < 0.5;
      order = allyFirst ? [[B.ally, e, move], [e, B.ally, eMove]] : [[e, B.ally, eMove], [B.ally, e, move]];
    } else order = [[e, B.ally, eMove]];

    for (const [u, t, mv] of order) {
      if (u.mon.hp <= 0 || t.mon.hp <= 0 || (u !== B.ally && u !== B.enemy)) continue;
      await useMove(u, t, mv);
      if (B.fled) return B.fled;
      const r = await resolveFaints(); if (r) return r;
    }
    // Poison and burns hurt at the end of each turn.
    for (const side of [B.ally, B.enemy]) {
      const m = side.mon;
      if (m.hp <= 0 || (m.status !== 'PSN' && m.status !== 'BRN')) continue;
      m.hp = Math.max(0, m.hp - Math.max(1, Math.floor(m.maxhp / 8)));
      await say(`${nameOf(side)} is hurt by ${m.status === 'PSN' ? 'poison' : 'its burn'}!`, { keep: true });
      await drainHP(m); ui.dialog = null;
      const r = await resolveFaints(); if (r) return r;
    }
  }
}
const speedOf = side => effStat(side, 'spd') * (side.mon.status === 'PAR' ? 0.25 : 1);
async function resolveFaints() {
  if (B.enemy.mon.hp <= 0 && (await enemyFainted())) return 'won';
  if (B.ally.mon.hp <= 0 && (await allyFainted()) === 'blackout') return 'lost';
  return null;
}
function inflict(side, st) {
  side.mon.status = st;
  if (st === 'SLP') side.mon.sleep = rand(1, 3);
}
const canInflict = (side, st) => !side.mon.status && !SPECIES[side.mon.name].types.includes(STATUS_IMMUNE[st]);
async function lunge(isAlly) {
  await tween(6, t => { const o = Math.round(Math.sin(t * Math.PI) * 8); if (isAlly) B.aX = o; else B.eX = -o; });
}
async function blink(isAlly) {
  for (let i = 0; i < 6; i++) { if (isAlly) B.aHide = !B.aHide; else B.eHide = !B.eHide; await wait(4); }
  B.aHide = B.eHide = false;
}
async function shake(isAlly) {
  await tween(16, t => { const o = Math.round(t * 16) % 4 < 2 ? 2 : -2; if (isAlly) B.aX = o; else B.eX = o; });
  B.aX = B.eX = 0;
}
async function drainHP(m) {
  const step = Math.max(1, Math.round(m.maxhp / 48));
  while (m.dhp !== m.hp) { m.dhp = m.dhp > m.hp ? Math.max(m.hp, m.dhp - step) : Math.min(m.hp, m.dhp + step); await wait(2); }
}
async function useMove(u, t, mv) {
  const M = MOVES[mv], isAlly = u === B.ally, me = u.mon;
  // Conditions that can stop a Pokémon from moving at all.
  if (me.status === 'SLP') {
    if (--me.sleep <= 0) { me.status = null; await say(`${nameOf(u)} woke up!`); }
    else await say(`${nameOf(u)} is fast asleep!`);
    return;
  }
  if (me.status === 'PAR' && Math.random() < 0.25) { await say(`${nameOf(u)} is fully paralyzed!`); return; }
  if (u.conf > 0) {
    if (--u.conf === 0) await say(`${nameOf(u)} snapped out of its confusion!`);
    else {
      await say(`${nameOf(u)} is confused!`);
      if (Math.random() < 0.5) {
        const dmg = Math.max(1, Math.floor(Math.floor((2 * me.lvl / 5 + 2) * 40 * effStat(u, 'atk') / effStat(u, 'def')) / 50) + 2);
        sfx('hit'); await blink(isAlly);
        me.hp = Math.max(0, me.hp - dmg); await drainHP(me);
        await say('It hurt itself in its confusion!');
        return;
      }
    }
  }
  if (isAlly && mv !== 'STRUGGLE') me.pp[me.moves.indexOf(mv)]--;
  await say(`${nameOf(u)} used ${mv}!`, { keep: true });
  await wait(8);
  if (M.self) {
    sfx('stat'); await wait(10);
    ui.dialog = null;
    if (u.st[M.self] >= 6) await say('Nothing happened!');
    else { u.st[M.self] = Math.min(6, u.st[M.self] + M.amt); await say(`${nameOf(u)}'s ${STAT_NAME[M.self]} ${M.amt > 1 ? 'greatly rose' : 'rose'}!`); }
    return;
  }
  if (M.heal) {
    ui.dialog = null;
    if (me.hp >= me.maxhp) { await say('But it failed!'); return; }
    sfx('heal'); me.hp = Math.min(me.maxhp, me.hp + Math.floor(me.maxhp / 2)); await drainHP(me);
    await say(`${nameOf(u)} regained health!`);
    return;
  }
  if (M.teleport) {
    ui.dialog = null;
    if (B.trainer) { await say('But it failed!'); return; }
    sfx('run'); B.fled = isAlly ? 'ran' : 'fled';
    if (!isAlly) { B.eVis = false; await say(`${nameOf(u)} teleported away!`); }
    return;
  }
  const accMul = u.st.acc >= 0 ? (3 + u.st.acc) / 3 : 3 / (3 - u.st.acc);
  if (!M.sure && Math.random() * 100 >= M.acc * accMul) { ui.dialog = null; await say(`${nameOf(u)}'s attack missed!`); return; }
  if (M.inflict === 'CONF') {
    ui.dialog = null;
    if (t.conf) { await say('But it failed!'); return; }
    sfx('stat'); await shake(!isAlly);
    t.conf = rand(2, 5);
    await say(`${nameOf(t)} became confused!`);
    return;
  }
  if (M.inflict) {
    ui.dialog = null;
    if (!canInflict(t, M.inflict)) { await say('But it failed!'); return; }
    sfx('stat'); await shake(!isAlly);
    inflict(t, M.inflict);
    await say(`${nameOf(t)} ${STATUS_TEXT[M.inflict]}`);
    return;
  }
  await lunge(isAlly);
  if (M.pow) {
    const crit = Math.random() < 1 / 16, eff = typeMul(M.type, SPECIES[t.mon.name].types);
    if (eff === 0) { ui.dialog = null; await say(`It doesn't affect ${nameOf(t)}...`); return; }
    const L = me.lvl * (crit ? 2 : 1), atk = effStat(u, 'atk') * (me.status === 'BRN' ? 0.5 : 1);
    let dmg = Math.floor(Math.floor((2 * L / 5 + 2) * M.pow * atk / effStat(t, 'def')) / 50) + 2;
    if (SPECIES[me.name].types.includes(M.type)) dmg = Math.floor(dmg * 1.5);
    dmg = Math.max(1, Math.floor(dmg * eff * rand(217, 255) / 255));
    sfx(eff > 1 ? 'super' : 'hit');
    await blink(!isAlly);
    const dealt = Math.min(t.mon.hp, dmg);
    t.mon.hp = Math.max(0, t.mon.hp - dmg);
    await drainHP(t.mon);
    ui.dialog = null;
    if (crit) await say('A critical hit!');
    if (eff > 1) await say("It's super effective!");
    else if (eff < 1) await say("It's not very effective...");
    if (M.drain && me.hp > 0 && me.hp < me.maxhp) {
      me.hp = Math.min(me.maxhp, me.hp + Math.max(1, Math.floor(dealt / 2))); await drainHP(me);
      await say(`Sucked health from ${nameOf(t)}!`);
    }
    if (M.recoil && me.hp > 0) {
      me.hp = Math.max(0, me.hp - Math.max(1, Math.floor(dealt / 4))); await drainHP(me);
      await say(`${nameOf(u)} is hit with recoil!`);
    }
    if (M.eff && t.mon.hp > 0 && Math.random() * 100 < M.chance) {
      if (M.eff === 'CONF') { if (!t.conf) { t.conf = rand(2, 5); await say(`${nameOf(t)} became confused!`); } }
      else if (canInflict(t, M.eff)) { inflict(t, M.eff); await say(`${nameOf(t)} ${STATUS_TEXT[M.eff]}`); }
    }
  } else {
    const st = M.stat;
    sfx('stat'); await shake(!isAlly);
    ui.dialog = null;
    if (t.st[st] <= -6) await say('Nothing happened!');
    else { t.st[st] = Math.max(-6, t.st[st] - (M.amt || 1)); await say(`${nameOf(t)}'s ${STAT_NAME[st]} ${M.amt > 1 ? 'greatly fell' : 'fell'}!`); }
  }
  ui.dialog = null;
}
// Returns true when the battle is over (the last enemy Pokémon fainted).
async function enemyFainted() {
  const e = B.enemy.mon, a = B.ally.mon, t = B.trainer;
  sfx('faint');
  await tween(16, tt => { B.eOffY = Math.round(48 * tt); });
  B.eVis = false; B.eInfo = false;
  await say(`${nameOf(B.enemy)} fainted!`);

  const gain = Math.max(1, Math.floor(SPECIES[e.name].exp * e.lvl / 7 * (t ? 1.5 : 1)) * 2);
  await say(`${a.name} gained ${gain} EXP. Points!`);

  while (a.lvl < 100 && a.exp >= (a.lvl + 1) ** 3) {
    const oldMax = a.maxhp;
    a.lvl++; calcStats(a); a.hp += a.maxhp - oldMax; a.dhp = a.hp;
    B.leveled.add(a);
    sfx('levelup'); await say(`${a.name} grew to level ${a.lvl}!`);
    const mv = (LEVEL_LEARN[a.name] || {})[a.lvl];
    if (mv) await learnMove(a, mv);
  }
  const next = B.team.find(m => m.hp > 0);
  if (t && next) { await enemySendOut(next); return false; }
  B.victory = true;
  if (t) {
    await tween(20, tt => { B.etX = Math.round(-80 * (1 - tt)); });
    await say(`${G.name} defeated ${t.name}!`);
    if (t.win) await say(t.win);
    G.money += t.prize; sfx('get');
    await say(`${G.name} got ¥${t.prize} for winning!`);
  } else {
    const found = e.lvl * 6;
    G.money += found;
    await say(`${G.name} picked up ¥${found}.`);
  }
  return true;
}
async function allyFainted() {
  const a = B.ally.mon;
  sfx('faint');

  B.aVis = false; B.aInfo = false;

}
async function tryRun() {

async function battleItem() {
  const items = bagList();
  if (!items.length) { await say('Your BAG is empty.'); return 'cancel'; }
  const i = await choose(items.map(n => n.padEnd(12) + 'x' + itemCount(n)), { x: 8, y: 0, w: 152, spacing: 12 });
  if (i < 0) return 'cancel';
  const name = items[i], it = ITEMS[name];
  if (it.ball) {
    if (B.trainer) { await say("The trainer blocked the BALL! Don't be a thief!"); return 'cancel'; }
    return (await throwBall(name)) ? 'caught' : 'used';
  }
  const used = await useItemOn(name);
  return used ? 'used' : 'cancel';
}
// Potions and status cures, used from the battle ITEM menu or the START menu.
async function useItemOn(name) {
  const it = ITEMS[name];
  if (it.ball) { await say("You can't use that here!"); return false; }
  if (it.candy && B) { await say('Save that for after the battle!'); return false; }
  ui.overlay = 'party'; ui.partyIdx = 0;
  say('Use on which POKéMON?', { keep: true });
  const idx = await choose(G.party.map(m => m.name), { draw: partyCursor });
  ui.overlay = null; ui.dialog = null;
  if (idx < 0) return false;
  const m = G.party[idx];
  if (it.candy) return useCandy(m);
  const works = m.hp > 0 && (it.heal ? m.hp < m.maxhp : m.status === it.cure);
  if (!works) { await say("It won't have any effect."); return false; }
  takeItem(name); sfx('heal');
  if (it.heal) {
    const before = m.hp;
    m.hp = Math.min(m.maxhp, m.hp + it.heal);
    if (B && B.ally && B.ally.mon === m) await drainHP(m); else m.dhp = m.hp;
    await say(`${m.name} recovered ${m.hp - before} HP!`);
  } else {
    m.status = null;
    await say(`${m.name} ${{ PSN: 'was cured of poison!', PAR: 'was cured of paralysis!', SLP: 'woke up!', BRN: 'was cured of its burn!' }[it.cure]}`);
  }

}
// RARE CANDY: one level, any moves that level teaches, and evolution if it's time.
async function useCandy(m) {
  if (m.lvl >= 100) { await say("It won't have any effect."); return false; }
  takeItem('RARE CANDY');
  const oldMax = m.maxhp;
  m.lvl++; m.exp = Math.max(m.exp, m.lvl ** 3); calcStats(m);
  if (m.hp > 0) m.hp += m.maxhp - oldMax;
  m.dhp = m.hp;
  sfx('levelup'); await say(`${m.name} grew to level ${m.lvl}!`);
  const mv = (LEVEL_LEARN[m.name] || {})[m.lvl];
  if (mv) await learnMove(m, mv);
  if (EVO[m.name] && m.lvl >= EVO[m.name][1] && m.hp > 0) {
    await fadeOut(); await evolve(m); G.scene = 'world'; await fadeIn();
  }

}
// The PC in every Poké Center stores Pokémon that don't fit in your team of six.
async function pcMenu() {

      if (i < 0) continue;

// A list that may be longer than the screen: shows 6 at a time with MORE to page.
async function pickFromList(names, prompt) {
  let page = 0;
  while (true) {
    const slice = names.slice(page * 6, page * 6 + 6), more = names.length > (page + 1) * 6 || page > 0;
    say(prompt, { keep: true });
    const opts = more ? [...slice, 'MORE...'] : slice;
    const i = await choose(opts, { x: 0, y: 0, w: 160, h: 8 + opts.length * 13, spacing: 13 });
    if (i < 0) { ui.dialog = null; return -1; }
    if (more && i === slice.length) { page = names.length > (page + 1) * 6 ? page + 1 : 0; continue; }
    ui.dialog = null;
    return page * 6 + i;
  }
}
async function throwBall(ballName = 'POKé BALL') {
  const m = B.enemy.mon;

  await say(`${G.name} used ${ballName}!`, { keep: true });
  sfx('throw');
  B.ball = { x: 24, y: 88, wob: 0 };
  await tween(24, t => { B.ball.x = Math.round(24 + 92 * t); B.ball.y = Math.round(80 - 60 * t - 36 * Math.sin(Math.PI * t)); });

    B.ball.wob = 0;
  }
  await wait(16);
  ui.dialog = null;
  if (caught) {

    if (soundMode === 1) sfx('caught');

    const isNew = !G.dex.own[m.name];

    await say(`All right! ${m.name} was caught!`);
    if (isNew && G.flags.dex) await say(`New POKéDEX data will be added for ${m.name}!`);
    if (G.party.length < 6) { G.party.push(m); await say(`${m.name} joined your team!`); }
    else { healMon(m); G.box.push(m); await say(`Your team is full. ${m.name} was sent to the PC BOX.`); }
    return true;
  }
  B.ball = null; B.eVis = true; sfx('hit');
  await say(['Oh no! The POKéMON broke free!', 'Aww! It appeared to be caught!', 'Aargh! Almost had it!'][shakes]);
  return false;

function drawIntro() {
  drawSprite(OAK_BIG, 56, 24);
  if (ui.introMon) drawSprite(MON_BIG[ui.introMon], 106, 48, 1, true);
}
function drawDialog() {
  const d = ui.dialog, page = d.pages[d.page];
  box(0, 96, 160, 48);
  let rem = d.chars;
  page.forEach((ln, i) => { drawText(ln.slice(0, Math.max(0, rem)), 8, 104 + i * 16); rem -= ln.length; });
  const done = d.chars >= page.join('').length;
  if (done && !(d.keep && d.page === d.pages.length - 1) && Math.floor(frame / 20) % 2 === 0) drawText('▼', 146, 132);
}
function drawMenu(m) {
  if (m.draw) { m.draw(m); return; }
  box(m.x, m.y, m.w, m.h);
  const colW = m.colW || (m.w - 16) / m.cols;
  m.opts.forEach((o, i) => {
    const tx = m.x + 12 + (i % m.cols) * colW, ty = m.y + 8 + Math.floor(i / m.cols) * m.spacing;
    drawText(o, tx, ty);
    if (i === m.idx) drawText('▶', tx - 8, ty);
  });
  if (m.extra) m.extra(m);
}
function render() {
  rect(ctx, 0, 0, 160, 144, 0);
  if (G.scene === 'title') drawTitle();
  else if (G.scene === 'intro') drawIntro();
  else if (G.scene === 'world') drawWorld();
  else if (G.scene === 'battle' && B) drawBattle();
  else if (G.scene === 'evolve' && ui.evo) drawSprite(MON_BIG[ui.evo.name], 56, 24);
  if (ui.overlay === 'party') drawParty();
  else if (ui.overlay === 'summary') drawSummary();
  else if (ui.overlay === 'dex') drawDex();
  else if (ui.overlay === 'dexEntry') drawDexEntry();
  else if (ui.overlay === 'card') drawCard();
  if (ui.showcase) { box(48, 4, 64, 64); drawSprite(MON_BIG[ui.showcase], 56, 12); }
  if (ui.dialog) drawDialog();
  if (ui.menu) drawMenu(ui.menu);
  if (ui.money) { box(88, 0, 72, 20); const t = '¥' + G.money; drawText(t, 153 - t.length * CW, 7); }
  if (ui.qty) {
    box(72, 64, 88, 32);
    drawText('x' + String(ui.qty.n).padStart(2, '0'), 80, 72);
    const t = '¥' + ui.qty.n * ui.qty.price; drawText(t, 153 - t.length * CW, 83);
  }
  if (ui.wipe > 0) { const w = Math.round(ui.wipe * 160); for (let i = 0; i < 9; i++) rect(ctx, i % 2 ? 160 - w : 0, i * 16, w, 16, 3); }
  if (ui.flash) { ctx.globalAlpha = 0.8; rect(ctx, 0, 0, 160, 144, 3); ctx.globalAlpha = 1; }
  if (ui.fade > 0) { ctx.globalAlpha = ui.fade; rect(ctx, 0, 0, 160, 144, 0); ctx.globalAlpha = 1; }
  if (ui.toastT > 0) { box(0, 0, 14 + ui.toast.length * CW, 20); drawText(ui.toast, 7, 7); }
}

// ---------------------------------------------------------------------------
// Save / load
// ---------------------------------------------------------------------------
const SAVE_KEY = 'pokemon-simple-game-save-v1';
const AUTOSAVE_TICKS = 60 * 60;
let lastAutoSave = 0;
const strip = m => ({ name: m.name, lvl: m.lvl, exp: m.exp, hp: m.hp, moves: m.moves, pp: m.pp, status: m.status, sleep: m.sleep });
const autosaveOn = () => G.flags.autosave !== false;
const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} hr ago`; };
// Saves go to two places: this browser's local storage, and (when the page is open in the
// Claude artifact viewer and you're signed in) a private save on your Claude account through the
// `db` capability. Only you can read your account save. Loading picks whichever copy is newer, so a
// browser that clears storage for embedded pages (Safari, in-app browsers) no longer loses the game.
const cloud = { ref: null, raw: null, ready: false, writing: false, pending: null };
const cloudInit = (async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/save');
    const snap = await ref.get();
    cloud.ref = ref; cloud.ready = true;
    if (snap.exists && typeof snap.data().json === 'string') cloud.raw = snap.data().json;
    if (G.scene === 'title') ui.saveInfo = saveStatus();
  } catch (e) { cloud.ref = null; cloud.ready = false; }
})();
// One account write at a time; a save requested mid-write goes out right after with the latest data.
async function cloudWrite(raw) {
  if (!cloud.ref) return;
  cloud.raw = raw;
  if (cloud.writing) { cloud.pending = raw; return; }
  cloud.writing = true;
  try {
    let next = raw;
    while (next) {
      cloud.pending = null;
      try { await cloud.ref.set({ json: next, savedAt: Date.now() }); }
      catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { cloud.ref = null; break; } }
      next = cloud.pending;
    }
  } finally { cloud.writing = false; }
}
function localRaw() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
function writeSave(raw) {
  let ok = false;
  try { localStorage.setItem(SAVE_KEY, raw); ok = true; } catch (e) { /* storage blocked; the account copy may still work */ }
  if (cloud.ref) { cloudWrite(raw); ok = true; }
  return ok;
}
// The newer of the browser save and the account save.
function bestSaveRaw() {
  const l = localRaw(), c = cloud.raw;
  const t = r => { try { return JSON.parse(r).savedAt || 0; } catch (e) { return -1; } };
  if (!l) return c; if (!c) return l;
  return t(c) > t(l) ? c : l;
}
function saveGame() {
  try {
    G.savedAt = Date.now();
    return writeSave(JSON.stringify({ name: G.name, party: G.party.map(strip), box: G.box.map(strip), money: G.money, bag: G.bag,
      dex: G.dex, lastHeal: G.lastHeal, flags: G.flags, badges: G.badges, map: G.map, x: G.x, y: G.y, dir: G.dir, savedAt: G.savedAt }));
  } catch (e) { return false; }
}
function autoSave() {
  if (!G.flags.started || !autosaveOn()) return;
  lastAutoSave = frame;
  if (saveGame()) { ui.toast = 'SAVED'; ui.toastT = 50; }
}
// Closing the tab, switching apps or locking the phone saves too.
const quickSave = () => { if (G.flags.started && autosaveOn() && G.scene !== 'evolve') saveGame(); };
addEventListener('pagehide', quickSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') quickSave(); });
function hasSave() { return !!bestSaveRaw(); }
function loadGame() {
  try {
    const d = JSON.parse(bestSaveRaw());
    if (!d || !Array.isArray(d.party)) return false;
    Object.assign(G, newState(), d);
    // Saves from version 2 had a ball count instead of a bag, and no Pokédex, PP or status.
    if (d.balls && !d.bag) G.bag = { 'POKé BALL': d.balls };
    G.flags.beat = G.flags.beat || {};
    G.badges = Array.isArray(d.badges) ? d.badges : [];
    if (!MAPS[G.map]) { G.map = 'town'; G.x = 5; G.y = 24; }
    if (!d.dex) for (const m of [...G.party, ...G.box]) own(m.name);
    if (G.flags.starter && !d.dex) { G.flags.dex = true; G.flags.rivalLeft = true; }
    for (const m of [...G.party, ...G.box]) {
      calcStats(m); m.hp = Math.min(m.hp, m.maxhp); m.dhp = m.hp;
      if (!Array.isArray(m.pp) || m.pp.length !== m.moves.length) m.pp = m.moves.map(mv => MOVES[mv].pp);
      m.status = m.status || null;
    }
    // A save taken mid-battle could have every Pokémon fainted; wake up at home instead.
    if (G.party.length && !G.party.some(m => m.hp > 0)) { healAll(); G.map = 'town'; G.x = 5; G.y = 24; G.dir = 'down'; }
    G.flags.started = true;
    return true;
  } catch (e) { return false; }
}

// ---------------------------------------------------------------------------
// Title & intro
// ---------------------------------------------------------------------------
// What the title screen says about saving: whether a save exists, and whether this browser keeps saves at all.
function saveStatus() {
  let d = null;
  try { d = JSON.parse(bestSaveRaw() || 'null'); } catch (e) { d = null; }
  if (d && Array.isArray(d.party)) return `SAVE: ${d.name} ${d.party.length} PKMN`;
  if (cloud.ready) return 'NO SAVED GAME';
  try { localStorage.setItem(SAVE_KEY + '-test', '1'); localStorage.removeItem(SAVE_KEY + '-test'); return 'NO SAVED GAME'; }
  catch (e) { return 'BROWSER BLOCKS SAVES'; }
}
async function main() {
  while (true) {
    G = newState(); P.off = 0;
    ui.saveInfo = saveStatus();
    await fadeIn();
    await waitButton();
    sfx('select');
    await Promise.race([cloudInit, wait(180)]);
    if (hasSave()) {
      // CONTINUE comes first so a quick double press loads your game instead of starting over.
      const i = await choose(['CONTINUE', 'NEW GAME'], { x: 36, y: 100, w: 88, h: 40, cancel: false });
      if (i === 0) {
        if (loadGame()) { ui.saveInfo = null; await fadeOut(); G.scene = 'world'; await fadeIn(); return; }
        await say("The saved game couldn't be loaded.");
      }
      if (!(await ask('Start a NEW GAME? Your saved game will be erased!'))) continue;
    }
    ui.saveInfo = null;
    await fadeOut();
    await intro();
    return;
  }
}
async function intro() {
  G = newState(); G.scene = 'intro';
  await fadeIn();
  await say('Hello there! Welcome to the world of POKéMON!');
  await say('My name is OAK! People call me the POKéMON PROF!');
  ui.introMon = 'PIKACHU';
  await say('This world is inhabited by creatures called POKéMON!');
  await say('For some people, POKéMON are pets. Others use them for battles.');
  ui.introMon = null;
  await say('First, what is your name?', { keep: true });
  const names = ['RED', 'ASH', 'JACK', 'ZAYN'];
  const n = await choose(names, { x: 0, y: 8, w: 56, h: 72, cancel: false });
  ui.dialog = null;
  G.name = names[n];
  await say(`Right! So your name is ${G.name}!`);
  await say(`${G.name}! Your very own POKéMON legend is about to unfold!`);
  await say('Come and see me at my LAB. It is just south of your house!');
  await fadeOut();
  G.scene = 'world';
  await fadeIn();
  G.flags.started = true;
  await say("Today's the day! PROF. OAK is waiting at his LAB, the big building to the south.");
  autoSave();
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function fit() {
  const extraW = 112, extraH = document.getElementById('shell').offsetHeight - cv.offsetHeight + document.getElementById('hint').offsetHeight + 48;
  const s0 = Math.min((innerWidth - extraW) / 160, (innerHeight - extraH) / 144);
  const s = s0 >= 2 ? Math.floor(s0) : Math.max(1, s0);
  cv.style.width = Math.floor(160 * s) + 'px';
  cv.style.height = Math.floor(144 * s) + 'px';
}
addEventListener('resize', fit);
fit();

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { tick(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
ui.fade = 1;
requestAnimationFrame(loop);
run(main);
</script>
